# 中文写作规范 · bundle patch
#
# 这一层做两件事：把 Host 插件行插进 Loader 条目列表，并给出它的初始配置。
#
# index.js 导出了 schemastery 的 `Config`（整棵 `.volatile()`），所以这里的 config
# 会先按 schema 校验、补齐默认值，再作为「活配置」交给插件：在 Web 端「插件」页
# （侧栏「插件」→ 已安装 → 中文写作规范 → 行名右侧箭头）改任何一项都不重挂插件，
# 改动写回当前 profile 的 cordis.patch.yml。schema 缺失时（旧部署）config 原样传给
# normalizeConfig()，非法值回落到默认值。
#
# 可调项（全部可选，下列值就是 schema 默认值）：
#   promptSection  true      是否注册 system prompt 段落
#   promptDetail   core      core | strict，strict 额外注入英文处理与引用规范
#   promptOrder    15000     prompt 段落排序（内置段落最大 10200）
#   guideTool      true      是否注册 zh_writing_guide（规范查询）
#   styleCheckTool true      是否注册 zh_style_check（排版自检）
#
#   preferences:             三条个人约定，上游规范把它们列为可选项或争议项。
#                            默认全部开启；置为 false 时：
#                              · 对应条目不再进入 system prompt
#                              · zh_writing_guide 换回上游口径的正文与示例
#                              · zh_style_check 关闭同名规则，并在报告里点名
#     cjkDigitSpacing true   中文和数字之间应当增加空格  → spacing-cjk-digit
#     linkSpacing     true   超链接两侧应当增加空格      → spacing-link
#     cornerQuotes    true   简体中文应当使用直角引号    → punct-quotes
#
#   check:
#     maxFindings  200       单次自检最多收集多少条
#     reportLimit  40        报告里最多列出多少条
#     disabledRules []       额外关闭的规则 id，如 [spacing-digit-unit]
- insert:
    - id: zh-writing-guide
      name: '@local/dsh-zh-writing-guide'
      config:
        promptSection: true
        promptDetail: core
        guideTool: true
        styleCheckTool: true
        preferences:
          cjkDigitSpacing: true
          linkSpacing: true
          cornerQuotes: true
